<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Confirm your email</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding: 24px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width: 600px; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 24px; color: #3c4043;">
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <img src="cid:logo" width="251" height="40" alt="Videoflix"
                   style="display: block; border: 0; max-width: 100%; height: auto;">
            </td>
          </tr>
          <tr>
            <td>
              <p style="margin: 0;">Dear <span style="color: #2e3edf;">{{ email }}</span>,</p>
              <p style="margin: 0 0 32px;">
                Thank you for registering with <span style="color: #2e3edf;">Videoflix</span>.
                To complete your registration and verify your email address, please click the link below:
              </p>
              <a href="{{ activation_link }}"
                 style="display: inline-block; padding: 12px 24px; border-radius: 40px; background-color: #2e3edf; color: #ffffff; font-weight: bold; text-decoration: none;">Activate account</a>
              <p style="margin: 32px 0 24px;">If you did not create an account with us, please disregard this email.</p>
              <p style="margin: 0 0 24px;">Best regards,</p>
              <p style="margin: 0;">Your Videoflix Team.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
